# PUBLICATION DE L'APPLICATION sur GitHub Pages, à chaque poussée sur main (ou à la demande, onglet
# « Actions » > « Publier l'application » > « Run workflow »). Seul le dossier app/ est publié, tel quel
# (pas d'étape de construction). Avant de publier : la liste des fichiers du mode hors ligne est refaite
# (au cas où un fichier aurait été ajouté sans lancer tools/precache.mjs) et les tests unitaires passent.
# Si des phrases n'ont pas encore leur voix (un lot fusionné avant la fabrication de ses voix, décision du
# parent du 6 octobre 2026), rien n'est publié et la version en ligne reste la précédente : la publication
# se fera à la poussée des voix (tools/voix/publier.mjs, docs/VOIX.md).
# Réglage à faire une fois dans GitHub : Settings > Pages > Source : « GitHub Actions ».
name: Publier l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois ; une nouvelle poussée remplace celle qui attend
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances des tests
        run: npm ci
      - name: Liste des fichiers pour le mode hors ligne
        run: |
          node tools/precache.mjs
          git diff --quiet -- app/sw-files.json app/sw.js || echo "::warning::app/sw-files.json n'était pas à jour dans le dépôt : la liste a été refaite pour cette publication (lancer node tools/precache.mjs)."
      - name: Tests unitaires
        run: npm test
        env:
          VOIX_A_FABRIQUER: tolere
      - name: Voix
        id: voix
        run: |
          if node tools/voix/fabriquer.mjs --verifier; then echo "pretes=oui" >> "$GITHUB_OUTPUT"
          else echo "pretes=non" >> "$GITHUB_OUTPUT"; echo "::warning::Publication reportée : des phrases n'ont pas encore leur voix. La version en ligne reste la précédente. Fabriquer les voix : node tools/voix/publier.mjs (docs/VOIX.md)."; fi
      - if: steps.voix.outputs.pretes == 'oui'
        uses: actions/configure-pages@v5
      - if: steps.voix.outputs.pretes == 'oui'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - if: steps.voix.outputs.pretes == 'oui'
        id: deploiement
        uses: actions/deploy-pages@v4
