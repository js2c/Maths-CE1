# TESTS D'UNE DEMANDE DE FUSION, avant de la fusionner : les mêmes tests unitaires que la publication
# (pages.yml), lancés à chaque poussée sur la branche d'une demande de fusion vers main. La coche verte
# (ou la croix rouge) s'affiche en bas de la demande de fusion. Les phrases dont la voix n'est pas encore
# fabriquée ne font pas échouer : elles sont signalées en avertissement, et la publication les attend
# (pages.yml ; décision du parent du 6 octobre 2026 : les voix de plusieurs lots se fabriquent d'un coup,
# après leur fusion, avec tools/voix/publier.mjs, docs/VOIX.md).
name: Tests de la demande de fusion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances des tests
        run: npm ci
      - name: Liste des fichiers pour le mode hors ligne
        run: node tools/precache.mjs --check || echo "::warning::app/sw-files.json n'est pas à jour (lancer node tools/precache.mjs) ; la publication la refera."
      - name: Voix à fabriquer
        run: node tools/voix/fabriquer.mjs --verifier || echo "::warning::Des phrases n'ont pas encore leur voix. Rien à corriger dans la demande de fusion ; le parent les fabriquera (docs/VOIX.md). Tant qu'elles manquent, la publication attend."
      - name: Tests unitaires
        run: npm test
        env:
          VOIX_A_FABRIQUER: tolere

  # (lot « Recette de l'enfant et nettoyage des couches », point 3) L'ENFANT IMPRÉVISIBLE, version courte : quelques graines
  # d'actions d'enfant tirées au hasard (reproductibles), dans Chromium (tests/e2e/enfant.mjs). La version longue (au moins
  # 200 graines de 300 actions, processeur ralenti ou non) tourne pendant les lots, pas ici.
  enfant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances des tests
        run: npm ci
      - name: Chromium (playwright-core de l'atelier)
        run: |
          cd art && npm ci --omit=optional --ignore-scripts
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e 'import("playwright-core").then((p) => console.log(p.chromium.executablePath()))')" >> "$GITHUB_ENV"
      - name: L'enfant imprévisible (3 graines de 60 actions)
        run: node tests/e2e/enfant.mjs --graines 3 --actions 60
        env:
          VOIX_A_FABRIQUER: tolere
