<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Pieuvre mascotte animée">
  <defs>
    <radialGradient id="headGrad" cx="32%" cy="22%" r="82%">
      <stop offset="0" stop-color="#ffb45f"/>
      <stop offset=".38" stop-color="#ff7a43"/>
      <stop offset=".78" stop-color="#ed4d3d"/>
      <stop offset="1" stop-color="#b92f38"/>
    </radialGradient>
    <linearGradient id="tentacleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a55"/>
      <stop offset=".5" stop-color="#f36a45"/>
      <stop offset="1" stop-color="#bd3440"/>
    </linearGradient>
    <radialGradient id="eyeBlue" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#72d9ff"/>
      <stop offset=".45" stop-color="#168dd3"/>
      <stop offset="1" stop-color="#073e7b"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#073642" flood-opacity=".30"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .tentacle { transform-box: fill-box; transform-origin: 50% 8%; }
    .t1 { animation: wave1 3.8s ease-in-out infinite; }
    .t2 { animation: wave2 4.3s ease-in-out -.7s infinite; }
    .t3 { animation: wave3 3.3s ease-in-out -1.1s infinite; }
    .t4 { animation: wave4 4.7s ease-in-out -2.3s infinite; }
    .t5 { animation: wave2 3.9s ease-in-out -1.8s infinite reverse; }
    .t6 { animation: wave3 4.4s ease-in-out -.4s infinite reverse; }
    .t7 { animation: wave1 4.1s ease-in-out -2s infinite reverse; }
    .t8 { animation: wave4 3.6s ease-in-out -1.4s infinite reverse; }
    .head { transform-box: fill-box; transform-origin: 50% 86%; animation: breathe 3.4s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5.2s ease-in-out infinite; }
    .pupils { animation: look 7s ease-in-out infinite; }
    .cheek { animation: cheek 3.4s ease-in-out infinite; }
    .bubble { opacity: 0; animation: bubble 5s ease-in infinite; }
    .bubble.b2 { animation-delay: 1.8s; }
    .bubble.b3 { animation-delay: 3.2s; }
    .happy-mouth,.explain-mouth,.explain-pointer { opacity: 0; }
    svg[data-state="happy"] .idle-mouth { opacity: 0; }
    svg[data-state="happy"] .happy-mouth { opacity: 1; }
    svg[data-state="happy"] .head { animation-duration: 2.1s; }
    svg[data-state="happy"] .t3, svg[data-state="happy"] .t6 { animation-duration: 2.2s; }
    svg[data-state="explain"] .idle-mouth { opacity: 0; }
    svg[data-state="explain"] .explain-mouth, svg[data-state="explain"] .explain-pointer { opacity: 1; }
    svg[data-state="explain"] .explain-pointer {
      animation: point 1.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 90%;
    }
    @keyframes wave1 { 0%,100%{transform:rotate(-2deg) scaleY(1)} 50%{transform:rotate(7deg) scaleY(.96)} }
    @keyframes wave2 { 0%,100%{transform:rotate(3deg) scaleY(1)} 50%{transform:rotate(-8deg) scaleY(1.03)} }
    @keyframes wave3 { 0%,100%{transform:rotate(-1deg) translateY(0)} 50%{transform:rotate(9deg) translateY(3px)} }
    @keyframes wave4 { 0%,100%{transform:rotate(2deg) translateX(0)} 50%{transform:rotate(-7deg) translateX(3px)} }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.018,.985)} }
    @keyframes blink { 0%,43%,47%,100%{transform:scaleY(1)} 45%{transform:scaleY(.08)} }
    @keyframes look { 0%,18%,100%{transform:translate(0,0)} 28%,40%{transform:translate(2px,-1px)} 58%,70%{transform:translate(-2px,1px)} }
    @keyframes cheek { 0%,100%{opacity:.78} 50%{opacity:1} }
    @keyframes bubble { 0%,72%{opacity:0;transform:translateY(0) scale(.7)} 78%{opacity:.55} 100%{opacity:0;transform:translateY(-52px) scale(1.15)} }
    @keyframes point { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-10deg) translateY(-4px)} }
    @media (prefers-reduced-motion: reduce) {
      .tentacle,.head,.eye,.pupils,.cheek,.bubble,.explain-pointer { animation: none !important; }
    }
  </style>

  <ellipse cx="210" cy="374" rx="118" ry="21" fill="#053b49" opacity=".16" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <g class="tentacle t1">
      <path d="M163 250 C112 247 70 239 45 208 C25 183 36 151 65 157 C87 162 76 185 61 177 C55 194 82 211 126 204" fill="none" stroke="url(#tentacleGrad)" stroke-width="35" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="71" cy="200" r="7"/><circle cx="91" cy="210" r="6"/><circle cx="111" cy="214" r="5"/></g>
    </g>
    <g class="tentacle t2">
      <path d="M183 266 C149 299 115 332 77 326 C47 321 41 294 60 282 C78 271 91 289 78 300 C98 307 117 286 135 258" fill="none" stroke="url(#tentacleGrad)" stroke-width="37" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="83" cy="305" r="6"/><circle cx="103" cy="301" r="6"/><circle cx="121" cy="286" r="5"/></g>
    </g>
    <g class="tentacle t7">
      <path d="M257 254 C309 242 344 214 355 177 C362 154 389 151 397 168 C407 188 389 206 375 194 C367 218 347 246 309 267" fill="none" stroke="url(#tentacleGrad)" stroke-width="36" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="337" cy="238" r="6"/><circle cx="352" cy="221" r="6"/><circle cx="365" cy="202" r="5"/></g>
    </g>
    <g class="tentacle t8">
      <path d="M277 275 C320 292 349 324 382 318 C405 313 411 289 395 279 C379 269 367 285 378 296 C355 300 339 281 321 263" fill="none" stroke="url(#tentacleGrad)" stroke-width="36" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="332" cy="288" r="6"/><circle cx="350" cy="300" r="6"/><circle cx="369" cy="304" r="5"/></g>
    </g>

    <g class="tentacle t3">
      <path d="M185 273 C169 319 165 360 193 372 C216 382 231 358 217 346 C205 336 196 350 204 359" fill="none" stroke="url(#tentacleGrad)" stroke-width="39" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="186" cy="320" r="6"/><circle cx="187" cy="339" r="5"/></g>
    </g>
    <g class="tentacle t4">
      <path d="M207 280 C201 329 213 370 242 372 C264 373 272 349 257 339 C244 330 234 344 243 354" fill="none" stroke="url(#tentacleGrad)" stroke-width="40" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="215" cy="323" r="6"/><circle cx="222" cy="343" r="5"/></g>
    </g>
    <g class="tentacle t5">
      <path d="M230 276 C252 315 279 344 309 337 C331 332 335 309 319 299 C305 291 295 307 305 317" fill="none" stroke="url(#tentacleGrad)" stroke-width="38" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="267" cy="315" r="6"/><circle cx="285" cy="324" r="5"/></g>
    </g>
    <g class="tentacle t6">
      <path d="M156 270 C130 303 108 346 128 363 C145 378 166 362 158 347 C151 334 137 342 142 352" fill="none" stroke="url(#tentacleGrad)" stroke-width="37" stroke-linecap="round"/>
      <g fill="#fff2df" stroke="#d94d43" stroke-width="2"><circle cx="139" cy="316" r="6"/><circle cx="130" cy="335" r="5"/></g>
    </g>

    <g class="head">
      <path d="M119 210 C110 147 126 75 185 47 C235 23 300 45 326 99 C350 149 335 218 293 244 C259 266 158 263 119 210Z" fill="url(#headGrad)" stroke="#8c2a35" stroke-width="5"/>
      <path d="M159 77 C186 53 235 45 270 60" fill="none" stroke="#ffd6a4" stroke-width="10" stroke-linecap="round" opacity=".65"/>
      <path d="M152 88 C173 67 199 60 216 58" fill="none" stroke="#fff8dc" stroke-width="5" stroke-linecap="round" opacity=".85"/>
      <g fill="#d93f3d" opacity=".58">
        <circle cx="155" cy="105" r="11"/><circle cx="179" cy="84" r="7"/><circle cx="205" cy="75" r="9"/><circle cx="146" cy="132" r="7"/><circle cx="171" cy="124" r="5"/><circle cx="222" cy="87" r="5"/><circle cx="264" cy="78" r="6"/>
      </g>
      <g fill="#f24e4c" opacity=".52"><circle cx="142" cy="153" r="5"/><circle cx="166" cy="151" r="4"/><circle cx="282" cy="99" r="5"/><circle cx="294" cy="119" r="4"/></g>

      <g class="pupils">
        <g class="eye">
          <ellipse cx="183" cy="170" rx="34" ry="42" fill="#fff" stroke="#592b36" stroke-width="4"/>
          <ellipse cx="190" cy="177" rx="22" ry="28" fill="url(#eyeBlue)"/>
          <ellipse cx="195" cy="183" rx="10" ry="14" fill="#071c3d"/>
          <circle cx="184" cy="163" r="8" fill="#fff"/><circle cx="201" cy="177" r="4" fill="#fff" opacity=".85"/>
        </g>
        <g class="eye">
          <ellipse cx="255" cy="165" rx="34" ry="42" fill="#fff" stroke="#592b36" stroke-width="4"/>
          <ellipse cx="262" cy="173" rx="22" ry="28" fill="url(#eyeBlue)"/>
          <ellipse cx="267" cy="179" rx="10" ry="14" fill="#071c3d"/>
          <circle cx="256" cy="159" r="8" fill="#fff"/><circle cx="273" cy="173" r="4" fill="#fff" opacity=".85"/>
        </g>
      </g>
      <path d="M150 134 Q181 113 205 131" fill="none" stroke="#713039" stroke-width="4" stroke-linecap="round" opacity=".75"/>
      <path d="M232 128 Q258 107 284 126" fill="none" stroke="#713039" stroke-width="4" stroke-linecap="round" opacity=".75"/>
      <ellipse class="cheek" cx="143" cy="210" rx="22" ry="12" fill="#ff92a1" opacity=".8"/>
      <ellipse class="cheek" cx="296" cy="204" rx="22" ry="12" fill="#ff92a1" opacity=".8"/>
      <path class="idle-mouth" d="M204 218 Q219 232 235 216" fill="none" stroke="#6c2832" stroke-width="5" stroke-linecap="round"/>
      <path class="happy-mouth" d="M196 214 Q220 247 244 212 Q222 228 196 214Z" fill="#7e2531" stroke="#6c2832" stroke-width="4"/>
      <path class="happy-mouth" d="M210 232 Q221 224 233 232" fill="none" stroke="#ff9d9f" stroke-width="5" stroke-linecap="round"/>
      <ellipse class="explain-mouth" cx="220" cy="222" rx="11" ry="8" fill="#713039"/>
    </g>

    <g class="explain-pointer">
      <path d="M290 265 C334 248 349 221 347 193" fill="none" stroke="url(#tentacleGrad)" stroke-width="28" stroke-linecap="round"/>
      <circle cx="348" cy="189" r="8" fill="#fff2df" stroke="#d94d43" stroke-width="2"/>
    </g>
  </g>

  <g fill="none" stroke="#d9fbff" stroke-width="3">
    <circle class="bubble" cx="343" cy="134" r="8"/>
    <circle class="bubble b2" cx="361" cy="156" r="5"/>
    <circle class="bubble b3" cx="331" cy="167" r="4"/>
  </g>
</svg>
